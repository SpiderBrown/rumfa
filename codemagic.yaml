workflows:
  agent-pwa-build:
    name: Rumfa Agent PWA build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/agent
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    when:
      changeset:
        includes:
          - apps/agent/**
          - shared/**
          - codemagic.yaml
    environment:
      node: 22
    scripts:
      - name: Install agent dependencies
        script: npm ci
      - name: Build installable web app
        script: npm run build
    artifacts:
      - apps/agent/dist/agent/browser/**

