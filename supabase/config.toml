# Supabase project settings used by `supabase start` / `supabase deploy`.
project_id = "rumfa"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
site_url = "http://localhost:4200"
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
# Configure an SMS provider (Twilio, MessageBird, Vonage or a Send SMS Hook to Africa's Talking)
# in the dashboard; OTP codes go to Nigerian numbers.

# Provider webhooks authenticate with ?key=WEBHOOK_KEY, not a user JWT.
[functions.sms-inbound]
verify_jwt = false
[functions.voice-events]
verify_jwt = false

[functions.calls]
verify_jwt = true
[functions.live-view]
verify_jwt = true
[functions.media-url]
verify_jwt = true
